services:
  backend:
    build:
      context: ./backend
    container_name: supplychain-backend
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AUTH_DB_PATH: /app/data/auth.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: supplychain-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  puppeteer-smoke:
    build:
      context: ./qa/puppeteer
    container_name: supplychain-puppeteer-smoke
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      TARGET_URL: http://frontend
    profiles: ["qa"]
