server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve index.html for any path. If request method is not GET/HEAD (e.g. POST),
  # static handling returns 405; serve index.html with 200 so the app loads.
  location / {
    try_files $uri /index.html;
    error_page 405 =200 /index.html;
  }

  # Proxy API calls to FastAPI service. Backend serves routes under /api, so pass full path.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 120s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
}
