apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supplychain-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: supplychain.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
