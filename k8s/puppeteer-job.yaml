apiVersion: batch/v1
kind: Job
metadata:
  name: supplychain-puppeteer-smoke
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: supplychain-puppeteer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URL
              value: http://frontend
